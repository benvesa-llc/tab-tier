<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>__MSG_tabMgmtPageTitle__</title>
    <style>
      :root {
        --bg:       #1e1e2e;
        --mantle:   #181825;
        --surface0: #313244;
        --surface1: #45475a;
        --overlay:  #6c7086;
        --text:     #cdd6f4;
        --subtext:  #a6adc8;
        --accent:   #cba6f7;
        --blue:     #89b4fa;
        --green:    #a6e3a1;
        --yellow:   #f9e2af;
        --sky:      #89dceb;
        --red:      #f38ba8;
        --hover2:   #2a2a3d;
        --t0-bg:    #45182a;
        --reconcile-bg: #1e2a1e;
        --tm-t4-bg: #6c7086;
        --tm-t4-fg: #cdd6f4;
      }
      [data-theme="light"] {
        --bg:       #eff1f5;
        --mantle:   #e6e9ef;
        --surface0: #ccd0da;
        --surface1: #bcc0cc;
        --overlay:  #9ca0b0;
        --text:     #4c4f69;
        --subtext:  #6c6f85;
        --accent:   #8839ef;
        --blue:     #1e66f5;
        --green:    #166534;
        --yellow:   #df8e1d;
        --sky:      #0369a1;
        --red:      #d20f39;
        --hover2:   #dce0eb;
        --t0-bg:    #fcdede;
        --reconcile-bg: #e8f5e9;
        --tm-t4-bg: #9ca0b0;
        --tm-t4-fg: #eff1f5;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Segoe UI", monospace, sans-serif;
        font-size: 13px;
        background: var(--bg);
        color: var(--text);
        padding: 20px;
      }
      h1 { color: var(--accent); font-size: 18px; margin-bottom: 4px; }
      .subtitle { color: var(--overlay); font-size: 12px; margin-bottom: 16px; }

      .toolbar {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
        flex-wrap: wrap;
        align-items: center;
      }
      button {
        padding: 6px 14px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
      }
      .btn-primary   { background: var(--accent); color: var(--bg); }
      .btn-secondary { background: var(--surface0); color: var(--text); }
      .btn-danger    { background: var(--t0-bg); color: var(--red); }
      .filter-wrap {
        position: relative;
        display: inline-flex;
        align-items: center;
      }
      #filterInput {
        background: var(--surface0);
        border: 1px solid var(--surface1);
        border-radius: 6px;
        padding: 5px 28px 5px 10px;
        font-size: 12px;
        color: var(--text);
        outline: none;
        width: 200px;
      }
      #filterInput:focus { border-color: var(--accent); }
      #filterClear {
        position: absolute;
        right: 6px;
        background: none;
        border: none;
        color: var(--overlay);
        font-size: 14px;
        cursor: pointer;
        padding: 0;
        line-height: 1;
        display: none;
      }
      #filterClear:hover { color: var(--text); }
      #refreshTime { font-size: 11px; color: var(--overlay); }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      thead th {
        background: var(--mantle);
        color: var(--subtext);
        font-weight: 600;
        padding: 8px 10px;
        text-align: left;
        position: sticky;
        top: 0;
        border-bottom: 1px solid var(--surface0);
        white-space: nowrap;
        cursor: pointer;
        user-select: none;
      }
      thead th:hover { color: var(--accent); }
      thead th.sorted-asc::after  { content: " ▲"; color: var(--accent); }
      thead th.sorted-desc::after { content: " ▼"; color: var(--accent); }

      tbody tr { border-bottom: 1px solid var(--bg); }
      tbody tr:nth-child(even) { background: var(--mantle); }
      tbody tr:hover { background: var(--hover2); }

      td { padding: 7px 10px; vertical-align: middle; }

      .tier-badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 11px;
        font-weight: 700;
        color: var(--bg);
      }
      .tier-0 { background: #f38ba8; }
      .tier-1 { background: #fab387; }
      .tier-2 { background: #f9e2af; }
      .tier-3 { background: #89b4fa; }
      .tier-4 { background: var(--tm-t4-bg); color: var(--tm-t4-fg); }

      .url-cell {
        max-width: 280px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--sky);
      }
      .domain-cell { color: var(--green); font-weight: 600; }
      .title-cell {
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--text);
      }
      .time-cell { color: var(--yellow); white-space: nowrap; }
      .status-active { color: var(--green); font-weight: 700; }
      .tabid-cell { color: var(--overlay); font-family: monospace; }

      .summary {
        display: flex;
        gap: 12px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .summary-item {
        background: var(--mantle);
        border: 1px solid var(--surface0);
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 12px;
      }
      .summary-item span { font-weight: 700; color: var(--accent); }

      #noData { color: var(--overlay); padding: 20px 0; text-align: center; display: none; }

      .cb-col { width: 32px; text-align: center; cursor: default; }
      input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }
      #openSelectedBtn { background: var(--green); color: var(--bg); }
      #openSelectedBtn:disabled { background: var(--surface0); color: var(--overlay); cursor: not-allowed; }

      .reconcile-result {
        display: none;
        background: var(--reconcile-bg);
        border: 1px solid var(--green);
        border-radius: 8px;
        padding: 10px 14px;
        margin-bottom: 14px;
        font-size: 12px;
      }
      .reconcile-result-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .reconcile-result-title {
        font-weight: 700;
        color: var(--green);
        font-size: 13px;
      }
      .reconcile-close {
        background: none;
        border: none;
        color: var(--overlay);
        font-size: 16px;
        cursor: pointer;
        padding: 0;
        line-height: 1;
      }
      .reconcile-close:hover { color: var(--text); }
      .reconcile-items {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .reconcile-item {
        background: var(--mantle);
        border: 1px solid var(--surface0);
        border-radius: 6px;
        padding: 5px 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }
      .reconcile-item .ri-val  { font-size: 18px; font-weight: 700; color: var(--accent); }
      .reconcile-item .ri-val.zero { color: var(--surface1); }
      .reconcile-item .ri-lbl  { font-size: 10px; color: var(--overlay); text-transform: uppercase; letter-spacing: 0.5px; }

    </style>
    <script src="theme.js"></script>
    <script src="i18n-dom.js"></script>
  </head>
  <body>
    <h1>__MSG_tabMgmtH1__</h1>
    <p class="subtitle">__MSG_tabMgmtSubtitle__</p>

    <div class="toolbar">
      <button class="btn-primary"   id="refreshBtn">__MSG_refreshBtnLabel__</button>
      <button class="btn-secondary" id="reconcileBtn">__MSG_reconcileBtnLabel__</button>
      <button class="btn-secondary" id="dedupBtn">__MSG_dedupBtnLabel__</button>
      <button id="openSelectedBtn" disabled>__MSG_openSelectedBtnLabel__</button>
      <button class="btn-secondary" id="copyBtn">__MSG_copyJsonBtnLabel__</button>
      <div class="filter-wrap">
        <input type="text" id="filterInput" placeholder="__MSG_filterPlaceholder__" />
        <button id="filterClear">✕</button>
      </div>
      <span id="refreshTime"></span>
    </div>

    <div class="reconcile-result" id="reconcileResult">
      <div class="reconcile-result-header">
        <span class="reconcile-result-title" id="reconcileResultTitle"></span>
        <button class="reconcile-close" id="reconcileClose">✕</button>
      </div>
      <div class="reconcile-items" id="reconcileItems"></div>
    </div>

    <div class="summary" id="summary"></div>

    <table id="dataTable">
      <thead>
        <tr>
          <th class="cb-col"><input type="checkbox" id="selectAllT4" title="__MSG_selectAllT4Title__"></th>
          <th data-col="isPinned">__MSG_colFixed__</th>
          <th data-col="tabId">__MSG_colTabId__</th>
          <th data-col="currentTier">__MSG_colTier__</th>
          <th data-col="openStatus">__MSG_colStatus__</th>
          <th data-col="domain">__MSG_colDomain__</th>
          <th data-col="title">__MSG_colTitle__</th>
          <th style="width:28px"></th>
          <th data-col="url">__MSG_colUrl__</th>
          <th data-col="lastFocusStart">__MSG_colFocusStart__</th>
          <th data-col="lastFocusEnd">__MSG_colFocusEnd__</th>
          <th data-col="elapsed">__MSG_colElapsed__</th>
          <th data-col="createdAt">__MSG_colCreated__</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <p id="noData">__MSG_noRecords__</p>

    <script src="tab-management.js"></script>
  </body>
</html>
