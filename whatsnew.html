<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What's New — Tab Tier</title>
    <style>
      :root {
        --bg:       #1e1e2e;
        --mantle:   #181825;
        --surface0: #313244;
        --surface1: #45475a;
        --overlay:  #6c7086;
        --text:     #cdd6f4;
        --subtext:  #a6adc8;
        --accent:   #cba6f7;
        --green:    #a6e3a1;
        --yellow:   #f9e2af;
        --red:      #f38ba8;
        --blue:     #89b4fa;
      }
      [data-theme="light"] {
        --bg:       #eff1f5;
        --mantle:   #e6e9ef;
        --surface0: #ccd0da;
        --surface1: #bcc0cc;
        --overlay:  #9ca0b0;
        --text:     #4c4f69;
        --subtext:  #6c6f85;
        --accent:   #8839ef;
        --green:    #166534;
        --yellow:   #df8e1d;
        --red:      #d20f39;
        --blue:     #0369a1;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }

      .page {
        max-width: 760px;
        margin: 0 auto;
        padding: 48px 24px 64px;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 40px;
      }
      .header-icon { font-size: 40px; flex-shrink: 0; }
      .header-text h1 {
        font-size: 24px;
        font-weight: 700;
        color: var(--accent);
        line-height: 1.2;
      }
      .header-text p {
        font-size: 13px;
        color: var(--subtext);
        margin-top: 4px;
      }

      .section-title {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--overlay);
        margin-bottom: 12px;
        margin-top: 36px;
      }

      .version-card {
        background: var(--mantle);
        border: 1px solid var(--surface0);
        border-radius: 14px;
        padding: 20px 22px;
        margin-bottom: 14px;
      }
      .version-header {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 14px;
      }
      .version-number {
        font-size: 15px;
        font-weight: 700;
        color: var(--accent);
      }
      .version-date {
        font-size: 12px;
        color: var(--overlay);
      }
      .version-badge {
        margin-left: auto;
        font-size: 10px;
        font-weight: 700;
        background: var(--accent);
        color: #1e1e2e;
        border-radius: 6px;
        padding: 2px 8px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      /* EN: Category heading per group (Added / Changed / Fixed). Color matches the type;
              first heading in a card has no top margin to avoid extra space.
         TR: Grup başına kategori başlığı (Added / Changed / Fixed). Renk tipe göre değişir;
              karttaki ilk başlığın üst boşluğu yok. */
      .change-category {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 3px 9px;
        border-radius: 5px;
        margin: 12px 0 8px;
      }
      .change-category:first-of-type { margin-top: 4px; }
      .change-category.type-feat   { background: #2a1a3a; color: var(--accent); }
      .change-category.type-fix    { background: #2a1a1a; color: var(--red); }
      .change-category.type-change { background: #1a2a1a; color: var(--green); }
      [data-theme="light"] .change-category.type-feat   { background: #ede0f9; }
      [data-theme="light"] .change-category.type-fix    { background: #fce8ec; }
      [data-theme="light"] .change-category.type-change { background: #e0f4e8; }

      .change-list {
        list-style: disc;
        padding-left: 22px;
        margin-bottom: 4px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .change-item {
        font-size: 13px;
        line-height: 1.5;
        color: var(--text);
      }
      .change-item::marker { color: var(--overlay); }

      .roadmap-list { display: flex; flex-direction: column; gap: 10px; }
      .roadmap-item {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--mantle);
        border: 1px solid var(--surface0);
        border-radius: 10px;
        padding: 12px 16px;
      }
      .roadmap-dot {
        flex-shrink: 0;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        opacity: 0.5;
      }
      .roadmap-title { flex: 1; font-size: 13px; color: var(--text); }

      .footer {
        margin-top: 44px;
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn-primary {
        background: var(--accent);
        color: #1e1e2e;
        border: none;
        border-radius: 10px;
        padding: 11px 28px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      .btn-primary:hover { opacity: 0.88; }
      .btn-secondary {
        background: var(--surface0);
        color: var(--subtext);
        border: none;
        border-radius: 10px;
        padding: 11px 20px;
        font-size: 13px;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      .btn-secondary:hover { opacity: 0.85; }

      .loading { text-align: center; padding: 40px; color: var(--overlay); font-size: 13px; }
    </style>
    <script src="theme.js"></script>
  </head>
  <body>
    <div class="page">
      <div class="header">
        <div class="header-icon">🗂️</div>
        <div class="header-text">
          <h1 id="pageTitle">What's New in Tab Tier</h1>
          <p id="pageSubtitle"></p>
        </div>
      </div>

      <div class="section-title" id="changelogTitle">Recent Changes</div>
      <div id="changelogContainer" class="loading">Loading…</div>

      <div class="section-title" id="roadmapTitle" style="margin-top:36px">Coming Up</div>
      <div id="roadmapContainer" class="loading">Loading…</div>

      <div class="footer">
        <button class="btn-primary"   id="openPopupBtn">Open Tab Tier</button>
        <button class="btn-secondary" id="openSettingsBtn">Settings</button>
      </div>
    </div>

    <script src="whatsnew.js"></script>
  </body>
</html>
