<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What's New — Tab Tier</title>
    <style>
      :root {
        --bg:       #1e1e2e;
        --mantle:   #181825;
        --surface0: #313244;
        --surface1: #45475a;
        --overlay:  #6c7086;
        --text:     #cdd6f4;
        --subtext:  #a6adc8;
        --accent:   #cba6f7;
        --green:    #a6e3a1;
        --yellow:   #f9e2af;
        --red:      #f38ba8;
        --blue:     #89b4fa;
      }
      [data-theme="light"] {
        --bg:       #eff1f5;
        --mantle:   #e6e9ef;
        --surface0: #ccd0da;
        --surface1: #bcc0cc;
        --overlay:  #9ca0b0;
        --text:     #4c4f69;
        --subtext:  #6c6f85;
        --accent:   #8839ef;
        --green:    #166534;
        --yellow:   #df8e1d;
        --red:      #d20f39;
        --blue:     #0369a1;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }

      .page {
        max-width: 760px;
        margin: 0 auto;
        padding: 48px 24px 64px;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 40px;
      }
      .header-icon { font-size: 40px; flex-shrink: 0; }
      .header-text h1 {
        font-size: 24px;
        font-weight: 700;
        color: var(--accent);
        line-height: 1.2;
      }
      .header-text p {
        font-size: 13px;
        color: var(--subtext);
        margin-top: 4px;
      }

      .section-title {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--overlay);
        margin-bottom: 12px;
        margin-top: 36px;
      }

      .version-card {
        background: var(--mantle);
        border: 1px solid var(--surface0);
        border-radius: 14px;
        padding: 20px 22px;
        margin-bottom: 14px;
      }
      .version-header {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 14px;
      }
      .version-number {
        font-size: 15px;
        font-weight: 700;
        color: var(--accent);
      }
      .version-date {
        font-size: 12px;
        color: var(--overlay);
      }
      .version-badge {
        margin-left: auto;
        font-size: 10px;
        font-weight: 700;
        background: var(--accent);
        color: #1e1e2e;
        border-radius: 6px;
        padding: 2px 8px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .change-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
      .change-item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        font-size: 13px;
        line-height: 1.5;
        color: var(--text);
      }
      .change-type {
        flex-shrink: 0;
        font-size: 10px;
        font-weight: 700;
        border-radius: 5px;
        padding: 2px 7px;
        margin-top: 2px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .type-feature     { background: #2a1a3a; color: var(--accent); }
      .type-fix         { background: #2a1a1a; color: var(--red); }
      .type-improvement { background: #1a2a1a; color: var(--green); }
      [data-theme="light"] .type-feature     { background: #ede0f9; }
      [data-theme="light"] .type-fix         { background: #fce8ec; }
      [data-theme="light"] .type-improvement { background: #e0f4e8; }

      .roadmap-list { display: flex; flex-direction: column; gap: 10px; }
      .roadmap-item {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--mantle);
        border: 1px solid var(--surface0);
        border-radius: 10px;
        padding: 12px 16px;
      }
      .roadmap-dot {
        flex-shrink: 0;
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      .dot-in_progress { background: var(--yellow); }
      .dot-planned     { background: var(--surface1); }
      .roadmap-title { flex: 1; font-size: 13px; color: var(--text); }
      .roadmap-eta   { font-size: 11px; color: var(--overlay); flex-shrink: 0; }

      .footer {
        margin-top: 44px;
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn-primary {
        background: var(--accent);
        color: #1e1e2e;
        border: none;
        border-radius: 10px;
        padding: 11px 28px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      .btn-primary:hover { opacity: 0.88; }
      .btn-secondary {
        background: var(--surface0);
        color: var(--subtext);
        border: none;
        border-radius: 10px;
        padding: 11px 20px;
        font-size: 13px;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      .btn-secondary:hover { opacity: 0.85; }

      .loading { text-align: center; padding: 40px; color: var(--overlay); font-size: 13px; }
    </style>
    <script src="theme.js"></script>
  </head>
  <body>
  <script type="application/json" id="changelogData">
  [
    {
      "version": "1.2.0", "date": "2026-04-20",
      "changes": [
        { "type": "feature",     "text": "Dark / light theme support — toggle with the 🌙 button in the popup or from Settings.", "textTR": "Koyu / açık tema desteği — popup'taki 🌙 butonu veya Ayarlar'dan anlık değiştirilebilir." },
        { "type": "fix",         "text": "Tab timers were reset after PC sleep / hibernate — elapsed time is now preserved.", "textTR": "PC uyku / hibernate sonrası sekme sayaçları sıfırlanıyordu — artık korunuyor." },
        { "type": "feature",     "text": "Clicking a URL in Tab Management focuses the tab; collapsed groups expand automatically.", "textTR": "Tab Yönetimi'nde URL'ye tıklamak sekmeyi odaklar, kapalı gruplar otomatik açılır." },
        { "type": "improvement", "text": "Favicon column added to Tab Management for easier visual identification.", "textTR": "Tab Yönetimi'ne favicon sütunu eklendi — siteleri görsel olarak tanımak kolaylaştı." },
        { "type": "fix",         "text": "Tabs with 'missing' status are now archived or deleted per the 'On Manual Close' setting.", "textTR": "'Yok' durumundaki sekmeler artık 'Manuel Kapatma' ayarına göre arşivleniyor veya siliniyor." },
        { "type": "improvement", "text": "Tier badge labels reflect the custom group names set in Settings.", "textTR": "Tier rozeti etiketleri, Ayarlar'da özelleştirilen grup adlarını yansıtıyor." },
        { "type": "improvement", "text": "Version number is now displayed in the header of all pages.", "textTR": "Sayfa başlıklarına sürüm numarası eklendi." },
        { "type": "feature",     "text": "What's New page opens automatically after each update.", "textTR": "Güncelleme sonrası Yenilikler sayfası otomatik açılıyor." }
      ]
    },
    {
      "version": "1.0.9", "date": "2026-04-18",
      "changes": [
        { "type": "improvement", "text": "Tier check now runs every 1 minute (was 5 minutes).", "textTR": "Tier kontrolü artık her 1 dakikada bir çalışıyor (eskiden 5 dakikaydı)." },
        { "type": "fix",         "text": "Tabs opened while the extension was stopped are detected and corrected on startup.", "textTR": "Uzantı dururken açılan sekmeler başlangıçta tespit edilip otomatik düzeltiliyor." },
        { "type": "improvement", "text": "Elapsed time shows up to 3 components: days + hours + minutes.", "textTR": "Geçen süre gün + saat + dakika şeklinde 3 bileşenli gösteriliyor." },
        { "type": "fix",         "text": "Fixed column in Tab Management is now a read-only indicator; tier changes via group drag.", "textTR": "Sabit sütun artık yalnızca okunabilir bir gösterge — tier değişiklikleri grup sürüklemesiyle yapılıyor." }
      ]
    },
    {
      "version": "1.0.0", "date": "2026-04-15",
      "changes": [
        { "type": "feature", "text": "T0–T4 tab lifecycle system with automatic tier transitions based on inactivity.", "textTR": "T0–T4 sekme yaşam döngüsü sistemi — hareketsizliğe göre otomatik kademe geçişleri." },
        { "type": "feature", "text": "Full English and Turkish language support (chrome.i18n).", "textTR": "Türkçe ve İngilizce tam dil desteği (chrome.i18n)." },
        { "type": "feature", "text": "Popup, Settings, Onboarding, and Tab Management pages.", "textTR": "Popup, Ayarlar, Başlangıç ve Tab Yönetimi sayfaları." },
        { "type": "feature", "text": "T0 fixed group — pinned tabs are never automatically demoted.", "textTR": "T0 sabit grubu — seçilen sekmeler asla otomatik düşürülmez." }
      ]
    }
  ]
  </script>
  <script type="application/json" id="roadmapData">
  [
    { "title": "Tab export / import (JSON + CSV)", "titleTR": "Sekme dışa / içe aktarma (JSON + CSV)", "status": "planned", "eta": "1.3.0" },
    { "title": "Per-domain custom tier rules",     "titleTR": "Domain bazlı özel tier kuralları",     "status": "planned", "eta": "1.3.0" },
    { "title": "Session snapshot & restore",       "titleTR": "Oturum anlık görüntüsü ve geri yükleme", "status": "planned", "eta": "1.4.0" },
    { "title": "Statistics dashboard (focus time, tier history)", "titleTR": "İstatistik paneli (odak süresi, tier geçmişi)", "status": "planned", "eta": "1.4.0" }
  ]
  </script>
    <div class="page">
      <div class="header">
        <div class="header-icon">🗂️</div>
        <div class="header-text">
          <h1 id="pageTitle">What's New in Tab Tier</h1>
          <p id="pageSubtitle"></p>
        </div>
      </div>

      <div class="section-title" id="changelogTitle">Recent Changes</div>
      <div id="changelogContainer" class="loading">Loading…</div>

      <div class="section-title" id="roadmapTitle" style="margin-top:36px">Coming Up</div>
      <div id="roadmapContainer" class="loading">Loading…</div>

      <div class="footer">
        <button class="btn-primary"   id="openPopupBtn">Open Tab Tier</button>
        <button class="btn-secondary" id="openSettingsBtn">Settings</button>
      </div>
    </div>

    <script>
      // EN: Use chrome.i18n for reliable locale detection in extension pages | TR: Extension sayfalarında dil tespiti
      const isTR = chrome.i18n.getUILanguage().toLowerCase().startsWith("tr");
      const lang = chrome.i18n.getUILanguage() || "en";

      function t(en, tr) { return isTR ? tr : en; }

      function typeLabel(type) {
        if (type === "feature")     return t("Feature",      "Özellik");
        if (type === "fix")         return t("Fix",          "Düzeltme");
        if (type === "improvement") return t("Improvement",  "İyileştirme");
        return type;
      }

      function statusLabel(status) {
        if (status === "in_progress") return t("In Progress", "Geliştiriliyor");
        return t("Planned", "Planlandı");
      }

      function formatDate(dateStr) {
        try {
          return new Date(dateStr).toLocaleDateString(lang, {
            year: "numeric", month: "long", day: "numeric",
          });
        } catch (e) { return dateStr; }
      }

      function showError(id, msg) {
        const el = document.getElementById(id);
        el.className = "";
        el.textContent = msg;
      }

      function loadChangelog(version) {
        const changelog = JSON.parse(document.getElementById("changelogData").textContent);
        const container = document.getElementById("changelogContainer");
        container.innerHTML = "";
        container.className = "";

        changelog.forEach(entry => {
          const isCurrent = entry.version === version;
          const card = document.createElement("div");
          card.className = "version-card";

          const header = document.createElement("div");
          header.className = "version-header";
          header.innerHTML =
            "<span class='version-number'>v" + entry.version + "</span>" +
            "<span class='version-date'>" + formatDate(entry.date) + "</span>" +
            (isCurrent ? "<span class='version-badge'>" + t("Installed", "Yüklü") + "</span>" : "");

          const list = document.createElement("ul");
          list.className = "change-list";
          entry.changes.forEach(c => {
            const li = document.createElement("li");
            li.className = "change-item";
            const badge = document.createElement("span");
            badge.className = "change-type type-" + c.type;
            badge.textContent = typeLabel(c.type);
            const txt = document.createElement("span");
            txt.textContent = (isTR && c.textTR) ? c.textTR : c.text;
            li.appendChild(badge);
            li.appendChild(txt);
            list.appendChild(li);
          });

          card.appendChild(header);
          card.appendChild(list);
          container.appendChild(card);
        });
      }

      function loadRoadmap() {
        const roadmap = JSON.parse(document.getElementById("roadmapData").textContent);
        const container = document.getElementById("roadmapContainer");
        container.innerHTML = "";
        container.className = "roadmap-list";

        roadmap.forEach(item => {
          const div = document.createElement("div");
          div.className = "roadmap-item";
          const dot = document.createElement("span");
          dot.className = "roadmap-dot dot-" + item.status;
          dot.title = statusLabel(item.status);
          const title = document.createElement("span");
          title.className = "roadmap-title";
          title.textContent = (isTR && item.titleTR) ? item.titleTR : item.title;
          const eta = document.createElement("span");
          eta.className = "roadmap-eta";
          eta.textContent = item.eta;
          div.appendChild(dot);
          div.appendChild(title);
          div.appendChild(eta);
          container.appendChild(div);
        });
      }

      function load() {
        const version = chrome.runtime.getManifest().version;

        document.getElementById("pageTitle").textContent    = t("What's New in Tab Tier", "Tab Tier'daki Yenilikler");
        document.getElementById("pageSubtitle").textContent = t("Version v" + version + " installed \u2014 thanks for using Tab Tier!", "S\xfcr\xfcm v" + version + " y\xfcklendi \u2014 te\u015fekk\xfcrler!");
        document.getElementById("changelogTitle").textContent = t("Recent Changes", "Son De\u011fi\u015fiklikler");
        document.getElementById("roadmapTitle").textContent   = t("Coming Up", "Yakında");
        document.getElementById("openPopupBtn").textContent   = t("Open Tab Tier", "Tab Tier'\u0131 A\xe7");
        document.getElementById("openSettingsBtn").textContent = t("Settings", "Ayarlar");

        try { loadChangelog(version); } catch(e) { showError("changelogContainer", "Error: " + e.message); }
        try { loadRoadmap(); }          catch(e) { showError("roadmapContainer",  "Error: " + e.message); }
      }

      document.getElementById("openPopupBtn").addEventListener("click", () => {
        chrome.action.openPopup().catch(() => window.close());
      });
      document.getElementById("openSettingsBtn").addEventListener("click", () => {
        chrome.tabs.create({ url: chrome.runtime.getURL("settings.html") });
      });

      try { load(); } catch(e) { console.error("whatsnew load error:", e); }
    </script>
  </body>
</html>
